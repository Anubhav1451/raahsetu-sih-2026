apiVersion: v1
kind: Namespace
metadata:
  name: raahsetu
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: raahsetu
spec:
  replicas: 2
  selector:
    matchLabels: {app: raahsetu-api}
  template:
    metadata:
      labels: {app: raahsetu-api}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          # Replace with your registry and immutable release tag or digest.
          image: raahsetu-api:0.1.0
          ports: [{containerPort: 8000}]
          env:
            - name: CORS_ORIGINS
              value: https://raahsetu.example.com
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "2", memory: 1Gi}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: raahsetu
spec:
  selector: {app: raahsetu-api}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: raahsetu
spec:
  replicas: 2
  selector:
    matchLabels: {app: raahsetu-web}
  template:
    metadata:
      labels: {app: raahsetu-web}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: raahsetu-web:0.1.0
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /, port: 8080}
          livenessProbe:
            httpGet: {path: /, port: 8080}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: raahsetu
spec:
  selector: {app: raahsetu-web}
  ports: [{port: 80, targetPort: 8080}]
