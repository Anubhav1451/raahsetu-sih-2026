[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "raahsetu-api"
version = "0.1.0"
description = "Explainable risk-aware routing for the SIH logistics prototype"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "python-dotenv>=1,<2",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
data = ["osmnx>=2.0,<3", "osmium>=4,<5", "scipy>=1.15,<2", "pypdf>=6,<7"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "networkx>=3.4,<4", "pyyaml>=6,<7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
