services:
  raahsetu-redis:
    image: redis:7-alpine
    container_name: raahsetu-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - raahsetu_redis_data:/data

volumes:
  raahsetu_redis_data:
